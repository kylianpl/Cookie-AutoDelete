name: Tagged Release Distribution

on:
  push:
    tags:
      - 'v[0-9].[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  all_jobs:
    name: Tests, Builds, Coverage, Release Uploads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install Dependencies (npm ci)
        run: npm ci --no-fund
      - name: Run Tests
        run: npm run test -- --verbose
      - name: Run Lint
        run: npm run lint
      - name: Ensure Version is Updated
        run: node ./tools/replaceVersionNumber.js
      - name: Run Build
        id: runbuild
        run: |
          npm run build
          echo "ffxpi=$(ls builds/*Firefox.xpi)" >> $GITHUB_OUTPUT
      - name: Archive Production Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: builds
      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Install web-ext
        if: startsWith(github.ref, 'refs/tags/')
        run: npm install --global web-ext

      - name: Sign XPI with AMO (unlisted / self-distributed)
        if: startsWith(github.ref, 'refs/tags/') && !(endsWith(github.ref, 'alpha') || endsWith(github.ref, 'beta'))
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          web-ext sign \
            --source-dir=extension \
            --artifacts-dir=builds/amo \
            --channel=unlisted
          echo 'Signed artifacts:'
          ls -la builds/amo

      - name: GitHub Releases
        id: github_releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            builds/Cookie-AutoDelete_*_Chrome.zip
            builds/Cookie-AutoDelete_*_Firefox.xpi
            builds/amo/*.xpi
          body: |
            Auto-generated fork release.

            - `Cookie-AutoDelete_*_Firefox.xpi` — unsigned build (Nightly / temporary add-on).
            - the `*.xpi` from `builds/amo/` — **signed by AMO** (unlisted), installable permanently.
          prerelease: ${{ endsWith(github.ref, 'alpha') || endsWith(github.ref, 'beta') }}
          draft: false
      # NOTE (fork): Chrome Web Store and AMO uploads from upstream are intentionally
      # removed because this fork does not own the upstream store listings/secrets.
